<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScholarFit 学术罗盘</title>
    <link rel="icon" href="web/assets/logo.svg" type="image/svg+xml" />
    <style>
      :root {
        --paper: #f7fbf6;
        --ink: #17231f;
        --forest: #1e7b5f;
        --matcha: #bfead6;
        --mint: #edf8f0;
        --lime: #dff3c9;
        --line: rgba(30, 123, 95, 0.14);
        --sans: "Avenir Next", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: var(--sans);
        background:
          radial-gradient(circle at 18% 14%, rgba(191, 234, 214, 0.78), transparent 29rem),
          radial-gradient(circle at 84% 12%, rgba(223, 243, 201, 0.76), transparent 30rem),
          linear-gradient(180deg, #fbfffb 0%, var(--paper) 56%, #eef8ef 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.48;
        background-image:
          radial-gradient(circle at 18px 18px, rgba(30, 123, 95, 0.08) 1.5px, transparent 2px);
        background-size: 36px 36px;
      }

      .page {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: clamp(1rem, 4vw, 3rem);
      }

      .card {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(17rem, 0.9fr);
        gap: clamp(1.5rem, 5vw, 4rem);
        width: min(68rem, 100%);
        padding: clamp(1.4rem, 4vw, 3.5rem);
        border: 1px solid var(--line);
        border-radius: clamp(1.6rem, 4vw, 3rem);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 28px 90px rgba(30, 123, 95, 0.12);
        backdrop-filter: blur(20px);
      }

      .logo-lockup {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }

      .logo-lockup img {
        width: 4.6rem;
        height: 4.6rem;
        filter: drop-shadow(0 14px 24px rgba(30, 123, 95, 0.16));
      }

      .brand {
        display: grid;
        gap: 0.2rem;
      }

      .brand span {
        color: var(--forest);
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .brand strong {
        font-size: 1.4rem;
      }

      h1 {
        margin: 2rem 0 1rem;
        max-width: 12ch;
        font-size: clamp(3rem, 8vw, 7rem);
        line-height: 0.95;
        letter-spacing: -0.08em;
        font-weight: 900;
      }

      .lead {
        max-width: 42rem;
        color: #63766d;
        font-size: clamp(1.05rem, 2vw, 1.28rem);
        line-height: 1.8;
      }

      .launch-panel {
        display: grid;
        align-content: center;
        gap: 1rem;
        padding: clamp(1.2rem, 3vw, 2rem);
        border-radius: 2.2rem;
        background:
          linear-gradient(150deg, rgba(30, 123, 95, 0.96), rgba(30, 123, 95, 0.86)),
          var(--forest);
        color: #ffffff;
      }

      .launch-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        width: 100%;
        min-height: 5.25rem;
        padding: 1rem 1.2rem;
        border: 0;
        border-radius: 999px;
        color: var(--forest);
        background: #ffffff;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.16);
        cursor: pointer;
        font: 900 1.25rem/1 var(--sans);
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .launch-buttons {
        display: grid;
        gap: 0.85rem;
      }

      .launch-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.26);
      }

      .launch-button img {
        width: 2.6rem;
        height: 2.6rem;
      }

      .launch-button.secondary {
        min-height: 4rem;
        color: #fff8ea;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }

      .launch-button small {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.75rem;
        font-weight: 700;
        opacity: 0.76;
      }

      .meta {
        display: grid;
        gap: 0.65rem;
        margin: 0;
        padding: 0;
        list-style: none;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.6;
      }

      .meta li {
        padding-left: 1.2rem;
        position: relative;
      }

      .meta li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.72em;
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: var(--lime);
      }

      .boundary {
        margin-top: 1.5rem;
        padding: 1rem;
        border: 1px solid rgba(30, 123, 95, 0.14);
        border-radius: 1.3rem;
        color: #35574b;
        background: #f1faf4;
        line-height: 1.7;
      }

      @media (max-width: 820px) {
        .card {
          grid-template-columns: 1fr;
        }

        h1 {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="title">
        <div>
          <div class="logo-lockup">
            <img src="web/assets/logo.svg" alt="ScholarFit logo" />
            <div class="brand">
              <span>ScholarFit</span>
              <strong>学术罗盘</strong>
            </div>
          </div>
          <h1 id="title">博士路径适配测评</h1>
          <p class="lead">
            一个故事化科研自我理解工具：通过真实研究情境、排序选择、压力恢复、导师环境匹配和行为证据，帮助你理解当前准备状态与下一步成长路径。
          </p>
          <p class="boundary">
            不用于招生筛选、招聘淘汰或心理诊断。报告只用于自我反思和科研路径规划。
          </p>
        </div>

        <aside class="launch-panel">
          <div class="launch-buttons">
            <a class="launch-button" href="web/index.html?mode=quick">
              <img src="web/assets/logo.svg" alt="" />
              <span>快速版测评<small>推荐 · 20 题 · 5-8 分钟</small></span>
            </a>
            <a class="launch-button secondary" href="web/index.html?mode=full">
              <span>完整版测评<small>80 题 · 20-30 分钟</small></span>
            </a>
          </div>
          <ul class="meta">
            <li>浏览器本地运行，无需账号。</li>
            <li>快速版适合首次体验，完整版适合完整自我梳理。</li>
            <li>完成后可复制 Markdown 报告，也可导出答案 JSON。</li>
          </ul>
        </aside>
      </section>
    </main>
  </body>
</html>
