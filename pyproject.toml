[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarfit"
version = "0.1.0"
description = "Story-based PhD fit and research potential assessment toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ScholarFit contributors"}]
keywords = ["assessment", "phd", "situational-judgment-test", "psychometrics", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
scholarfit = "scholarfit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scholarfit*"]
